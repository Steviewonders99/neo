[package]
name = "terminal-panes"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "terminal_panes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# tauri-plugin-window-vibrancy = "0.5"  # Not available on crates.io; will implement vibrancy via NSVisualEffectView directly
tauri-plugin-notification = "2"
portable-pty = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "io-util", "time"] }
regex = "1"
once_cell = "1"
uuid = { version = "1", features = ["v4", "serde"] }
parking_lot = "0.12"
bytes = "1"
strip-ansi-escapes = "0.2"
dirs = "5"
