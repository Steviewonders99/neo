name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend (Vitest + tsc)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Test
        run: npm test

  backend:
    name: Backend (cargo test + clippy)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      # Tauri build depends on dist/ being present
      - run: npm ci
      - run: npm run build
      - name: Cargo test
        working-directory: src-tauri
        run: cargo test --lib
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --lib -- -D warnings
        continue-on-error: true
